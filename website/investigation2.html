<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSI Subject Analyzer - Investigation 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: #f8f9fa;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #1a1a1a;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 15px;
            margin-top: 30px;
            color: #2c3e50;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 8px;
        }
        h3 {
            font-size: 18px;
            margin-bottom: 12px;
            margin-top: 20px;
            color: #34495e;
        }
        .info {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .loading {
            text-align: center;
            padding: 80px;
            font-size: 20px;
            color: #666;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f5f5f5;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .text-right {
            text-align: right;
        }
        .text-center {
            text-align: center;
        }
        .section {
            margin-bottom: 50px;
            border: 1px solid #e0e0e0;
            padding: 25px;
            border-radius: 6px;
            background: #fafafa;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 4px;
            background: white;
        }
        .stat-box div {
            font-size: 14px;
            margin-bottom: 5px;
        }
        button {
            padding: 10px 20px;
            border: 1px solid #3498db;
            background: #3498db;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover {
            background: #2980b9;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calculations {
            margin-top: 20px;
        }
        .hidden {
            display: none;
        }
        .font-medium {
            font-weight: 600;
        }
        .bg-gray {
            background-color: #f9f9f9;
        }
        .skipped-note {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 14px;
        }
        .error {
            color: #dc3545;
        }
        
        /* Graph Styles */
        #graph-container {
            width: 100%;
            height: 600px;
            margin: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .graph-title {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 4px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        
        .legend-color {
            width: 24px;
            height: 3px;
            border-radius: 2px;
        }
        
        /* Question Type Analysis */
        .question-type-section {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }
        
        .question-type-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .question-type-card {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fafafa;
        }
        
        .question-type-card h4 {
            font-size: 15px;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        
        .question-type-card .value {
            font-size: 20px;
            font-weight: 600;
            color: #3498db;
        }
        
        .comparison-table {
            margin-top: 20px;
        }
        
        .highlight-max {
            background-color: #d4edda;
            font-weight: 600;
        }
        
        .highlight-min {
            background-color: #f8d7da;
        }
        
        /* Toggle Controls */
        .toggle-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            align-items: center;
        }
        
        .toggle-controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            padding: 5px 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .toggle-controls label:hover {
            background: #e9ecef;
        }
        
        .toggle-controls input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
        
        .toggle-section {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .toggle-section-title {
            font-weight: 600;
            font-size: 13px;
            color: #666;
            margin-right: 10px;
        }
        
        .subject-toggles {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        /* Average SSI Bar */
        .graph-with-bar {
            display: flex;
            gap: 20px;
            align-items: stretch;
        }
        
        .graph-main {
            flex: 1;
        }
        
        .average-bar-container {
            width: 200px;
            display: flex;
            flex-direction: column;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
        }
        
        .average-bar-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            color: #2c3e50;
        }
        
        .average-bar-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        
        .average-bar-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .average-bar-item:hover {
            background: #f8f9fa;
        }
        
        .average-bar-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        
        .average-bar-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .average-bar-subject {
            font-size: 12px;
            font-weight: 600;
            line-height: 1.2;
        }
        
        .average-bar-value {
            font-size: 14px;
            font-weight: 700;
            color: #2c3e50;
        }
        
        .average-bar-rank {
            font-size: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SSI Subject Analyzer - Investigation 2</h1>
        <div class="info">Data loaded from: RESEARCH-DATA/investigation 2/fields</div>
        
        <div id="loading" class="loading">Loading data from GitHub...</div>
        <div id="content" class="hidden"></div>
    </div>

    <script>
        var subjects = [
            'Biology',
            'Chemistry',
            'Computer science',
            'Economics',
            'English Language',
            'Ethics',
            'History',
            'Mathematics',
            'Philosophy',
            'Physics'
        ];
        
        // Define vibrant, distinct colors for each subject
        var subjectColors = {
            'Biology': '#2ecc71',
            'Chemistry': '#e74c3c',
            'Computer science': '#3498db',
            'Economics': '#f39c12',
            'English Language': '#9b59b6',
            'Ethics': '#1abc9c',
            'History': '#e67e22',
            'Mathematics': '#34495e',
            'Philosophy': '#c0392b',
            'Physics': '#16a085'
        };
        
        // Visibility state for each subject and average line
        var subjectVisibility = {};
        for (var i = 0; i < subjects.length; i++) {
            subjectVisibility[subjects[i]] = true;
        }
        var showAverageLine = true;
        
        // Global results for redrawing
        var globalResults = null;
        
        function toggleSubject(subject) {
            subjectVisibility[subject] = !subjectVisibility[subject];
            if (globalResults) {
                drawGraph(globalResults);
            }
        }
        
        function toggleAverageLine() {
            showAverageLine = !showAverageLine;
            if (globalResults) {
                drawGraph(globalResults);
            }
        }
        
        // Question type mapping in the original order
        var questionTypesOriginal = [
            'Computational-Numerical',
            'Procedural-How-To',
            'Conceptual-Definition',
            'Analytical-Multistep-Reasoning',
            'Interpretive-Contextual',
            'Evaluative-Normative',
            'Design-Methodological',
            'Closed-Factual'
        ];
        
        // Question types in the display order (reversed from the specified order)
        var questionTypes = [
            'Analytical-Multistep-Reasoning',
            'Procedural-How-To',
            'Design-Methodological',
            'Evaluative-Normative',
            'Interpretive-Contextual',
            'Computational-Numerical',
            'Closed-Factual',
            'Conceptual-Definition'
        ];
        
        // Map question indices to types, accounting for skipped types
        function getQuestionType(questionNumber, skippedType) {
            var num = parseInt(questionNumber.substring(1));
            var typeIndex = Math.floor((num - 1) / 6);
            
            // Build list of available types (excluding skipped)
            var availableTypes = [];
            for (var i = 0; i < questionTypesOriginal.length; i++) {
                if (questionTypesOriginal[i] !== skippedType) {
                    availableTypes.push(questionTypesOriginal[i]);
                }
            }
            
            return availableTypes[typeIndex] || 'Unknown';
        }

        function calculateStats(values) {
            var n = values.length;
            if (n === 0) return { mean: 0, stdDev: 0, min: 0, max: 0, n: 0 };
            
            var sum = 0;
            for (var i = 0; i < values.length; i++) {
                sum += values[i];
            }
            var mean = sum / n;
            
            var varianceSum = 0;
            for (var i = 0; i < values.length; i++) {
                varianceSum += Math.pow(values[i] - mean, 2);
            }
            var variance = varianceSum / n;
            var stdDev = Math.sqrt(variance);
            var min = Math.min.apply(null, values);
            var max = Math.max.apply(null, values);
            
            return { mean: mean, stdDev: stdDev, min: min, max: max, n: n };
        }

        function analyzeSubject(questions, answers, skippedType) {
            var questionKeys = Object.keys(questions).sort(function(a, b) {
                var numA = parseInt(a.substring(1));
                var numB = parseInt(b.substring(1));
                return numA - numB;
            });
            
            var answerKeys = Object.keys(answers).sort(function(a, b) {
                var numA = parseInt(a.substring(1));
                var numB = parseInt(b.substring(1));
                return numA - numB;
            });

            var ratios = [];
            var calculations = [];
            var typeAnalysis = {};
            
            // Initialize type analysis
            for (var i = 0; i < questionTypes.length; i++) {
                typeAnalysis[questionTypes[i]] = {
                    questionSSI: [],
                    answerSSI: [],
                    ratios: []
                };
            }

            for (var i = 0; i < questionKeys.length; i++) {
                var qKey = questionKeys[i];
                var aKey = answerKeys[i];
                var qValue = questions[qKey];
                var aValue = answers[aKey];
                var ratio = aValue / qValue;
                var type = getQuestionType(qKey, skippedType);
                
                ratios.push(ratio);
                calculations.push({
                    question: qKey,
                    answer: aKey,
                    questionSSI: qValue,
                    answerSSI: aValue,
                    ratio: ratio,
                    type: type
                });
                
                // Add to type analysis
                if (typeAnalysis[type]) {
                    typeAnalysis[type].questionSSI.push(qValue);
                    typeAnalysis[type].answerSSI.push(aValue);
                    typeAnalysis[type].ratios.push(ratio);
                }
            }
            
            // Calculate stats for each type
            var typeStats = {};
            for (var type in typeAnalysis) {
                if (typeAnalysis.hasOwnProperty(type)) {
                    typeStats[type] = {
                        avgQuestionSSI: calculateStats(typeAnalysis[type].questionSSI).mean,
                        avgAnswerSSI: calculateStats(typeAnalysis[type].answerSSI).mean,
                        avgRatio: calculateStats(typeAnalysis[type].ratios).mean,
                        ratioStats: calculateStats(typeAnalysis[type].ratios)
                    };
                }
            }

            var questionValues = [];
            for (var k in questions) {
                if (questions.hasOwnProperty(k)) {
                    questionValues.push(questions[k]);
                }
            }
            
            var answerValues = [];
            for (var k in answers) {
                if (answers.hasOwnProperty(k)) {
                    answerValues.push(answers[k]);
                }
            }
            
            var qSum = 0;
            for (var i = 0; i < questionValues.length; i++) {
                qSum += questionValues[i];
            }
            var avgQuestionSSI = questionValues.length > 0 ? qSum / questionValues.length : 0;
            
            var aSum = 0;
            for (var i = 0; i < answerValues.length; i++) {
                aSum += answerValues[i];
            }
            var avgAnswerSSI = answerValues.length > 0 ? aSum / answerValues.length : 0;
            
            var rSum = 0;
            for (var i = 0; i < ratios.length; i++) {
                rSum += ratios[i];
            }
            var avgRatio = ratios.length > 0 ? rSum / ratios.length : 0;
            
            var ratioStats = calculateStats(ratios);
            var questionStats = calculateStats(questionValues);
            var answerStats = calculateStats(answerValues);

            return {
                calculations: calculations,
                avgQuestionSSI: avgQuestionSSI,
                avgAnswerSSI: avgAnswerSSI,
                avgRatio: avgRatio,
                ratioStats: ratioStats,
                questionStats: questionStats,
                answerStats: answerStats,
                typeStats: typeStats
            };
        }

        function toggleCalculations(id) {
            var elem = document.getElementById(id);
            if (elem.classList.contains('hidden')) {
                elem.classList.remove('hidden');
            } else {
                elem.classList.add('hidden');
            }
            var button = document.querySelector('button[data-target="' + id + '"]');
            if (elem.classList.contains('hidden')) {
                button.textContent = 'Show Detailed Calculations';
            } else {
                button.textContent = 'Hide Detailed Calculations';
            }
        }

        function fetchAllData() {
            var baseUrl = '../RESEARCH-DATA/investigation 2/fields';
            var results = {};
            var completed = 0;
            var total = subjects.length;
            
            for (var i = 0; i < subjects.length; i++) {
                (function(subject) {
                    var questionsUrl = baseUrl + '/' + subject + '/ssi_of_questions';
                    var answersUrl = baseUrl + '/' + subject + '/ssi_of_answers';
                    var skippedUrl = baseUrl + '/' + subject + '/skipped';
                    
                    var skippedType = null;
                    
                    fetch(skippedUrl)
                        .then(function(r) { 
                            if (r.ok) {
                                return r.text();
                            }
                            return null;
                        })
                        .then(function(skippedData) {
                            if (skippedData) {
                                skippedType = skippedData.trim();
                            }
                            
                            return fetch(questionsUrl)
                                .then(function(r) { return r.json(); })
                                .then(function(questionsData) {
                                    return fetch(answersUrl)
                                        .then(function(r) { return r.json(); })
                                        .then(function(answersData) {
                                            results[subject] = analyzeSubject(questionsData, answersData, skippedType);
                                            results[subject].skippedType = skippedType;
                                            completed++;
                                            if (completed === total) {
                                                renderResults(results);
                                            }
                                        });
                                });
                        })
                        .catch(function(err) {
                            console.error('Error fetching ' + subject + ':', err);
                            completed++;
                            if (completed === total) {
                                renderResults(results);
                            }
                        });
                })(subjects[i]);
            }
        }
        
        function drawGraph(results) {
            var canvas = document.getElementById('ssi-graph');
            var ctx = canvas.getContext('2d');
            var width = canvas.width;
            var height = canvas.height;
            
            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Margins
            var margin = { top: 40, right: 40, bottom: 100, left: 80 };
            var plotWidth = width - margin.left - margin.right;
            var plotHeight = height - margin.top - margin.bottom;
            
            // Find min and max ratio values across all subjects and types
            var allRatios = [];
            for (var subject in results) {
                if (results.hasOwnProperty(subject)) {
                    var typeStats = results[subject].typeStats;
                    for (var type in typeStats) {
                        if (typeStats.hasOwnProperty(type) && typeStats[type].ratioStats.n > 0) {
                            allRatios.push(typeStats[type].avgRatio);
                        }
                    }
                }
            }
            
            // Calculate average values for each question type
            var averageByType = {};
            for (var t = 0; t < questionTypes.length; t++) {
                var type = questionTypes[t];
                var typeRatios = [];
                for (var subject in results) {
                    if (results.hasOwnProperty(subject)) {
                        var typeStats = results[subject].typeStats;
                        if (typeStats[type] && typeStats[type].ratioStats.n > 0) {
                            typeRatios.push(typeStats[type].avgRatio);
                        }
                    }
                }
                if (typeRatios.length > 0) {
                    var sum = 0;
                    for (var i = 0; i < typeRatios.length; i++) {
                        sum += typeRatios[i];
                    }
                    averageByType[type] = sum / typeRatios.length;
                    allRatios.push(averageByType[type]);
                }
            }
            
            var minRatio = Math.min.apply(null, allRatios);
            var maxRatio = Math.max.apply(null, allRatios);
            var range = maxRatio - minRatio;
            var yMin = minRatio - range * 0.1;
            var yMax = maxRatio + range * 0.1;
            
            // Draw axes
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(margin.left, margin.top);
            ctx.lineTo(margin.left, height - margin.bottom);
            ctx.lineTo(width - margin.right, height - margin.bottom);
            ctx.stroke();
            
            // Draw grid lines
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            var numYGridLines = 8;
            for (var i = 0; i <= numYGridLines; i++) {
                var y = margin.top + (plotHeight / numYGridLines) * i;
                ctx.beginPath();
                ctx.moveTo(margin.left, y);
                ctx.lineTo(width - margin.right, y);
                ctx.stroke();
                
                // Y-axis labels
                var value = yMax - (yMax - yMin) * (i / numYGridLines);
                ctx.fillStyle = '#333';
                ctx.font = '12px Arial';
                ctx.textAlign = 'right';
                ctx.fillText(value.toFixed(3), margin.left - 10, y + 4);
            }
            
            // X-axis labels
            var xStep = plotWidth / (questionTypes.length - 1);
            ctx.fillStyle = '#333';
            ctx.font = '11px Arial';
            ctx.textAlign = 'center';
            for (var i = 0; i < questionTypes.length; i++) {
                var x = margin.left + xStep * i;
                var label = questionTypes[i];
                
                // Rotate text for better fit
                ctx.save();
                ctx.translate(x, height - margin.bottom + 15);
                ctx.rotate(-Math.PI / 4);
                ctx.fillText(label, 0, 0);
                ctx.restore();
            }
            
            // X-axis label
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Increasing Stability Question Type →', width / 2, height - 10);
            
            // Y-axis label
            ctx.save();
            ctx.translate(20, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('SSI Ratio (Answer/Question)', 0, 0);
            ctx.restore();
            
            // Plot lines for each subject
            for (var subject in results) {
                if (results.hasOwnProperty(subject) && subjectVisibility[subject]) {
                    var typeStats = results[subject].typeStats;
                    var color = subjectColors[subject];
                    
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2.5;
                    
                    // Draw line segments between consecutive valid points
                    var lastValidPoint = null;
                    for (var i = 0; i < questionTypes.length; i++) {
                        var type = questionTypes[i];
                        if (typeStats[type] && typeStats[type].ratioStats.n > 0) {
                            var ratio = typeStats[type].avgRatio;
                            var x = margin.left + xStep * i;
                            var y = margin.top + plotHeight - ((ratio - yMin) / (yMax - yMin)) * plotHeight;
                            
                            var currentPoint = {x: x, y: y};
                            
                            if (lastValidPoint) {
                                // Draw line from last valid point to current point
                                ctx.beginPath();
                                ctx.moveTo(lastValidPoint.x, lastValidPoint.y);
                                ctx.lineTo(currentPoint.x, currentPoint.y);
                                ctx.stroke();
                            }
                            
                            lastValidPoint = currentPoint;
                        } else {
                            // No data for this type, create gap
                            lastValidPoint = null;
                        }
                    }
                    
                    // Draw points (including for isolated points)
                    ctx.fillStyle = color;
                    for (var i = 0; i < questionTypes.length; i++) {
                        var type = questionTypes[i];
                        if (typeStats[type] && typeStats[type].ratioStats.n > 0) {
                            var ratio = typeStats[type].avgRatio;
                            var x = margin.left + xStep * i;
                            var y = margin.top + plotHeight - ((ratio - yMin) / (yMax - yMin)) * plotHeight;
                            
                            ctx.beginPath();
                            ctx.arc(x, y, 4, 0, 2 * Math.PI);
                            ctx.fill();
                        }
                    }
                }
            }
            
            // Draw average line if enabled
            if (showAverageLine) {
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
                ctx.setLineDash([8, 4]);
                
                var lastValidPoint = null;
                for (var i = 0; i < questionTypes.length; i++) {
                    var type = questionTypes[i];
                    if (averageByType[type]) {
                        var ratio = averageByType[type];
                        var x = margin.left + xStep * i;
                        var y = margin.top + plotHeight - ((ratio - yMin) / (yMax - yMin)) * plotHeight;
                        
                        var currentPoint = {x: x, y: y};
                        
                        if (lastValidPoint) {
                            ctx.beginPath();
                            ctx.moveTo(lastValidPoint.x, lastValidPoint.y);
                            ctx.lineTo(currentPoint.x, currentPoint.y);
                            ctx.stroke();
                        }
                        
                        lastValidPoint = currentPoint;
                    } else {
                        lastValidPoint = null;
                    }
                }
                
                // Draw points for average line
                ctx.fillStyle = '#000000';
                ctx.setLineDash([]);
                for (var i = 0; i < questionTypes.length; i++) {
                    var type = questionTypes[i];
                    if (averageByType[type]) {
                        var ratio = averageByType[type];
                        var x = margin.left + xStep * i;
                        var y = margin.top + plotHeight - ((ratio - yMin) / (yMax - yMin)) * plotHeight;
                        
                        ctx.beginPath();
                        ctx.arc(x, y, 5, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                }
            }
        }

        function renderResults(results) {
            globalResults = results;
            
            var entries = [];
            for (var key in results) {
                if (results.hasOwnProperty(key)) {

                }

                return b[1].avgRatio - a[1].avgRatio;
            });
            
            var html = '<h2>Multi-Subject SSI Ratio Comparison by Question Type</h2>';
            
            // Toggle controls
            html += '<div class="toggle-controls">';
            html += '<div class="toggle-section">';
            html += '<span class="toggle-section-title">Show/Hide Lines:</span>';
            html += '</div>';
            html += '<div class="subject-toggles">';
            html += '<label><input type="checkbox" checked onchange="toggleAverageLine()" id="toggle-average"><span style="font-weight: 600;">Average Line</span></label>';
            for (var i = 0; i < subjects.length; i++) {
                var subject = subjects[i];

                html += '<label>';
                html += '<input type="checkbox" checked onchange="toggleSubject(\'' + subject + '\')" id="toggle-' + subject.replace(/\s+/g, '-') + '">';
                html += '<span style="color: ' + color + '; font-weight: 500;">' + subject + '</span>';
                html += '</label>';
            }
            html += '</div>';
            html += '</div>';

            html += '<div class="graph-main">';

                html += '<span>' + subject + '</span>';
                html += '</div>';
            }
            html += '</div>';
            html += '</div>';
            html += '</div>';
            
            // Average SSI Bar
            html += '<div class="average-bar-container">';
            html += '<div class="average-bar-title">Overall Average SSI Ratio</div>';
            html += '<div class="average-bar-items">';
            
            // Sort entries by avgRatio for the bar
            var sortedEntries = entries.slice().sort(function(a, b) {
                return b[1].avgRatio - a[1].avgRatio;
            });
            
            for (var idx = 0; idx < sortedEntries.length; idx++) {
                var name = sortedEntries[idx][0];
                var data = sortedEntries[idx][1];
                var color = subjectColors[name];
                
                html += '<div class="average-bar-item">';
                html += '<div class="average-bar-color" style="background-color: ' + color + ';"></div>';
                html += '<div class="average-bar-info">';
                html += '<div class="average-bar-subject" style="color: ' + color + ';">' + name + '</div>';
                html += '<div class="average-bar-value">' + data.avgRatio.toFixed(4) + '</div>';
                html += '<div class="average-bar-rank">#' + (idx + 1) + '</div>';
                html += '</div>';
                html += '</div>';
            }
            
            html += '</div>';
            html += '</div>';
            html += '</div>';
            
            // Question Type Comparison Table
            html += '<h2>Question Type Analysis Across All Subjects</h2>';
            html += '<div class="question-type-section">';
            html += '<table class="comparison-table">';
            html += '<thead><tr class="bg-gray">';
            html += '<th>Question Type</th>';
            for (var i = 0; i < subjects.length; i++) {
                html += '<th class="text-right">' + subjects[i] + '</th>';
            }
            html += '</tr></thead><tbody>';
            
            for (var t = 0; t < questionTypes.length; t++) {
                var type = questionTypes[t];
                html += '<tr>';
                html += '<td><strong>' + type + '</strong></td>';
                
                var ratiosForType = [];
                for (var i = 0; i < subjects.length; i++) {
                    var subject = subjects[i];
                    var typeStats = results[subject].typeStats;
                    if (typeStats[type] && typeStats[type].ratioStats.n > 0) {
                        ratiosForType.push(typeStats[type].avgRatio);
                    }
                }
                
                var maxVal = ratiosForType.length > 0 ? Math.max.apply(null, ratiosForType) : null;
                var minVal = ratiosForType.length > 0 ? Math.min.apply(null, ratiosForType) : null;
                
                for (var i = 0; i < subjects.length; i++) {
                    var subject = subjects[i];
                    var typeStats = results[subject].typeStats;
                    if (typeStats[type] && typeStats[type].ratioStats.n > 0) {
                        var val = typeStats[type].avgRatio;
                        var className = '';
                        if (maxVal !== null && val === maxVal) className = 'highlight-max';
                        else if (minVal !== null && val === minVal) className = 'highlight-min';
                        html += '<td class="text-right ' + className + '">' + val.toFixed(4) + '</td>';

            }
            html += '</tbody></table>';
            html += '</div>';
            
            html += '<h2>Summary Rankings by Subject</h2>';
            html += '<table><thead><tr class="bg-gray"><th>Rank</th><th>Subject</th><th>Skipped Question Type</th><th class="text-right">Avg Question SSI</th><th class="text-right">Avg Answer SSI</th><th class="text-right">Avg SSI Ratio</th><th class="text-right">Ratio Std Dev</th></tr></thead><tbody>';
            
            for (var idx = 0; idx < entries.length; idx++) {
                var name = entries[idx][0];
                var data = entries[idx][1];

                html += '<tr>' +
                    '<td>' + (idx + 1) + '</td>' +
                    '<td><strong style="color: ' + subjectColors[name] + ';">' + name + '</strong></td>' +
                    '<td>' + skippedDisplay + '</td>' +
                    '<td class="text-right">' + data.avgQuestionSSI.toFixed(4) + '</td>' +
                    '<td class="text-right">' + data.avgAnswerSSI.toFixed(4) + '</td>' +
                    '<td class="text-right font-medium">' + data.avgRatio.toFixed(4) + '</td>' +
                    '<td class="text-right">' + data.ratioStats.stdDev.toFixed(4) + '</td>' +
                '</tr>';

            html += '</tbody></table>';

                html += '<th class="text-right">Avg Answer SSI</th>';

                html += '<th class="text-right">Ratio Std Dev</th>';
                html += '<th class="text-right">Count</th>';
                html += '</tr></thead><tbody>';
                
                for (var t = 0; t < questionTypes.length; t++) {
                    var type = questionTypes[t];

                        var ts = data.typeStats[type];
                        html += '<tr>';
                        html += '<td><strong>' + type + '</strong></td>';
                        html += '<td class="text-right">' + ts.avgQuestionSSI.toFixed(4) + '</td>';
                        html += '<td class="text-right">' + ts.avgAnswerSSI.toFixed(4) + '</td>';
                        html += '<td class="text-right font-medium">' + ts.avgRatio.toFixed(4) + '</td>';
                        html += '<td class="text-right">' + ts.ratioStats.stdDev.toFixed(4) + '</td>';
                        html += '<td class="text-right">' + ts.ratioStats.n + '</td>';
                        html += '</tr>';
                    } else {
                        html += '<tr>';
                        html += '<td><strong>' + type + '</strong></td>';
                        html += '<td class="text-right" style="color: #999;">-</td>';
                        html += '<td class="text-right" style="color: #999;">-</td>';
                        html += '<td class="text-right" style="color: #999;">-</td>';
                        html += '<td class="text-right" style="color: #999;">-</td>';
                        html += '<td class="text-right" style="color: #999;">-</td>';
                        html += '</tr>';
                    }
                }
                
                html += '</tbody></table>';
                
                html += '<h3>Overall Statistics</h3>';
                html += '<div class="stats-grid">' +
                        '<div class="stat-box">' +
                            '<h3>Question SSI Statistics</h3>' +
                            '<div>Mean: ' + data.questionStats.mean.toFixed(4) + '</div>' +
                            '<div>Std Dev: ' + data.questionStats.stdDev.toFixed(4) + '</div>' +
                            '<div>Min: ' + data.questionStats.min.toFixed(4) + '</div>' +
                            '<div>Max: ' + data.questionStats.max.toFixed(4) + '</div>' +
                            '<div>Count: ' + data.questionStats.n + '</div>' +
                        '</div>' +
                        '<div class="stat-box">' +
                            '<h3>Answer SSI Statistics</h3>' +
                            '<div>Mean: ' + data.answerStats.mean.toFixed(4) + '</div>' +
                            '<div>Std Dev: ' + data.answerStats.stdDev.toFixed(4) + '</div>' +
                            '<div>Min: ' + data.answerStats.min.toFixed(4) + '</div>' +
                            '<div>Max: ' + data.answerStats.max.toFixed(4) + '</div>' +

                        '<div class="stat-box">' +
                            '<h3>SSI Ratio Statistics</h3>' +
                            '<div>Mean: ' + data.ratioStats.mean.toFixed(4) + '</div>' +
                            '<div>Std Dev: ' + data.ratioStats.stdDev.toFixed(4) + '</div>' +
                            '<div>Min: ' + data.ratioStats.min.toFixed(4) + '</div>' +
                            '<div>Max: ' + data.ratioStats.max.toFixed(4) + '</div>' +
                            '<div>Count: ' + data.ratioStats.n + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div id="' + id + '" class="calculations hidden">' +
                        '<h3>Individual Question Calculations</h3>' +
                        '<table>' +
                            '<thead>' +
                                '<tr class="bg-gray">' +
                                    '<th>Question</th>' +
                                    '<th>Answer</th>' +

                                    '<th class="text-right">Answer SSI</th>' +

                                '</tr>' +
                            '</thead>' +

                for (var c = 0; c < data.calculations.length; c++) {

                        '<td>' + calc.answer + '</td>' +

                    '<td class="text-right">' + data.avgRatio.toFixed(6) + '</td>' +
                '</tr>' +
                            '</tbody>' +
                        '</table>' +
                    '</div>' +
                '</div>';
            }
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').innerHTML = html;
            document.getElementById('content').classList.remove('hidden');
            
            // Draw the graph after rendering
            setTimeout(function() {
                drawGraph(results);
            }, 100);
        }

        fetchAllData();
    </script>
