<body>
<div class="container">

    <div class="page-header">
        <h1>SSI Subject Analyzer — Investigation 2</h1>
        <p class="subtitle">Data source: RESEARCH-DATA / investigation 2 / fields</p>
    </div>

    <div class="body-content">
        <div id="loading" class="loading">Loading data …</div>
        <div id="content" class="hidden"></div>
    </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   DATA & CONFIG
   ═══════════════════════════════════════════════════════════════ */
var subjects = [
    'Biology','Chemistry','Computer science','Economics',
    'English Language','Ethics','History','Mathematics','Philosophy','Physics'
];

var subjectColors = {
    'Biology':'#2ecc71','Chemistry':'#e74c3c','Computer science':'#3498db',
    'Economics':'#f39c12','English Language':'#9b59b6','Ethics':'#1abc9c',
    'History':'#e67e22','Mathematics':'#34495e','Philosophy':'#c0392b','Physics':'#16a085'
};

var questionTypesOriginal = [
    'Computational-Numerical','Procedural-How-To','Conceptual-Definition',
    'Analytical-Multistep-Reasoning','Interpretive-Contextual',
    'Evaluative-Normative','Design-Methodological','Closed-Factual'
];

var questionTypes = [
    'Analytical-Multistep-Reasoning','Procedural-How-To','Design-Methodological',
    'Evaluative-Normative','Interpretive-Contextual','Computational-Numerical',
    'Closed-Factual','Conceptual-Definition'
];

var shortLabels = {
    'Analytical-Multistep-Reasoning':'Analytical',
    'Procedural-How-To':'Procedural',
    'Design-Methodological':'Design',
    'Evaluative-Normative':'Evaluative',
    'Interpretive-Contextual':'Interpretive',
    'Computational-Numerical':'Computational',
    'Closed-Factual':'Closed-Factual',
    'Conceptual-Definition':'Conceptual'
};

/* ─── visibility state ─── */
var subjectVisibility = {};
subjects.forEach(function(s){ subjectVisibility[s] = true; });
var showAverageLine = true;
var globalResults = null;

function toggleSubject(s){ subjectVisibility[s] = !subjectVisibility[s]; if(globalResults) drawGraph(globalResults); }
function toggleAverageLine(){ showAverageLine = !showAverageLine; if(globalResults) drawGraph(globalResults); }

/* ═══════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════ */
function getQuestionType(qNum, skipped) {
    var num = parseInt(qNum.substring(1));
    var idx = Math.floor((num - 1) / 6);
    var avail = questionTypesOriginal.filter(function(t){ return t !== skipped; });
    return avail[idx] || 'Unknown';
}

function calcStats(arr) {
    var n = arr.length;
    if (!n) return { mean:0, stdDev:0, min:0, max:0, n:0 };
    var sum = arr.reduce(function(a,b){ return a+b; }, 0);
    var mean = sum / n;
    var variance = arr.reduce(function(a,v){ return a + Math.pow(v - mean, 2); }, 0) / n;
    return { mean: mean, stdDev: Math.sqrt(variance), min: Math.min.apply(null, arr), max: Math.max.apply(null, arr), n: n };
}

function zScoreVal(val, mean, sd) { return sd === 0 ? 0 : (val - mean) / sd; }

function zClass(z) { return z > 0.05 ? 'z-pos' : (z < -0.05 ? 'z-neg' : 'z-zero'); }

function zColor(z) {
    if (z < -2)   return '#b71c1c';
    if (z < -1.5) return '#c62828';
    if (z < -1)   return '#ef5350';
    if (z < -0.5) return '#ef9a9a';
    if (z < 0)    return '#ffcdd2';
    if (z < 0.5)  return '#c8e6c9';
    if (z < 1)    return '#66bb6a';
    if (z < 1.5)  return '#43a047';
    if (z < 2)    return '#2e7d32';
    return '#1b5e20';
}

function zTextColor(z) { return Math.abs(z) > 1.2 ? '#fff' : '#1a1a1a'; }

/* ═══════════════════════════════════════════════════════════════
   QUESTION-SCORE LOGIC
      Ratio       weight 0.40  — normalised 0-1 across subjects (min-max)
      Z-Score     weight 0.30  — sigmoid mapped to 0-1
      Consistency weight 0.30  — 1/(1+stdDev), normalised 0-1
   Final = weighted sum × 100
   ═══════════════════════════════════════════════════════════════ */
function sigmoid(x) { return 1 / (1 + Math.exp(-x)); }

function computeSubjectScores(results) {
    var rows = [];
    subjects.forEach(function(s) {
        var r = results[s];
        var ratios = [], zs = [], consis = [];
        questionTypes.forEach(function(t) {
            var ts = r.typeStats[t];
            if (ts && ts.ratioStats.n > 0) {
                ratios.push(ts.avgRatio);
                zs.push(ts.zScore || 0);
                consis.push(1 / (1 + ts.ratioStats.stdDev));
            }
        });
        rows.push({
            subject: s,
            avgRatio: calcStats(ratios).mean,
            avgZ: calcStats(zs).mean,
            avgConsis: calcStats(consis).mean
        });
    });

    var ratioVals  = rows.map(function(r){ return r.avgRatio; });
    var consisVals = rows.map(function(r){ return r.avgConsis; });
    var rMin = Math.min.apply(null, ratioVals), rMax = Math.max.apply(null, ratioVals);
    var cMin = Math.min.apply(null, consisVals), cMax = Math.max.apply(null, consisVals);

    rows.forEach(function(row) {
        var normR = rMax === rMin ? 0.5 : (row.avgRatio - rMin) / (rMax - rMin);
        var normZ = sigmoid(row.avgZ);
        var normC = cMax === cMin ? 0.5 : (row.avgConsis - cMin) / (cMax - cMin);
        row.score = (normR * 0.4 + normZ * 0.3 + normC * 0.3) * 100;
    });

    rows.sort(function(a,b){ return b.score - a.score; });
    return rows;
}

function computeTypeScores(results) {
    var rows = [];
    questionTypes.forEach(function(t) {
        var ratios = [], zs = [], consis = [];
        subjects.forEach(function(s) {
            var ts = results[s].typeStats[t];
            if (ts && ts.ratioStats.n > 0) {
                ratios.push(ts.avgRatio);
                zs.push(ts.zScore || 0);
                consis.push(1 / (1 + ts.ratioStats.stdDev));
            }
        });
        if (!ratios.length) return;
        rows.push({
            type: t,
            avgRatio: calcStats(ratios).mean,
            avgZ: calcStats(zs).mean,
            avgConsis: calcStats(consis).mean,
            count: ratios.length
        });
    });

    var ratioVals  = rows.map(function(r){ return r.avgRatio; });
    var consisVals = rows.map(function(r){ return r.avgConsis; });
    var rMin = Math.min.apply(null, ratioVals), rMax = Math.max.apply(null, ratioVals);
    var cMin = Math.min.apply(null, consisVals), cMax = Math.max.apply(null, consisVals);

    rows.forEach(function(row) {
        var normR = rMax === rMin ? 0.5 : (row.avgRatio - rMin) / (rMax - rMin);
        var normZ = sigmoid(row.avgZ);
        var normC = cMax === cMin ? 0.5 : (row.avgConsis - cMin) / (cMax - cMin);
        row.score = (normR * 0.4 + normZ * 0.3 + normC * 0.3) * 100;
    });

    rows.sort(function(a,b){ return b.score - a.score; });
    return rows;
}

/* ═══════════════════════════════════════════════════════════════
   ANALYSIS
   ═══════════════════════════════════════════════════════════════ */
function analyzeSubject(questions, answers, skippedType) {
    var qKeys = Object.keys(questions).sort(function(a,b){ return parseInt(a.slice(1)) - parseInt(b.slice(1)); });
    var aKeys = Object.keys(answers).sort(function(a,b){ return parseInt(a.slice(1)) - parseInt(b.slice(1)); });

    var ratios = [], calculations = [];
    var typeAnalysis = {};
    questionTypes.forEach(function(t){ typeAnalysis[t] = { qSSI:[], aSSI:[], ratios:[] }; });

    qKeys.forEach(function(qk, i) {
        var ak = aKeys[i], qv = questions[qk], av = answers[ak], ratio = av / qv;
        var type = getQuestionType(qk, skippedType);
        ratios.push(ratio);
        calculations.push({ question: qk, answer: ak, questionSSI: qv, answerSSI: av, ratio: ratio, type: type });
        if (typeAnalysis[type]) { typeAnalysis[type].qSSI.push(qv); typeAnalysis[type].aSSI.push(av); typeAnalysis[type].ratios.push(ratio); }
    });

    var typeStats = {};
    for (var t in typeAnalysis) {
        if (typeAnalysis.hasOwnProperty(t)) {
            typeStats[t] = {
                avgQuestionSSI: calcStats(typeAnalysis[t].qSSI).mean,
                avgAnswerSSI:   calcStats(typeAnalysis[t].aSSI).mean,
                avgRatio:       calcStats(typeAnalysis[t].ratios).mean,
                ratioStats:     calcStats(typeAnalysis[t].ratios)
            };
        }
    }

    var qVals = Object.keys(questions).map(function(k){ return questions[k]; });
    var aVals = Object.keys(answers).map(function(k){ return answers[k]; });

    return {
        calculations: calculations,
        avgQuestionSSI: calcStats(qVals).mean,
        avgAnswerSSI:   calcStats(aVals).mean,
        avgRatio:       calcStats(ratios).mean,
        ratioStats:     calcStats(ratios),
        questionStats:  calcStats(qVals),
        answerStats:    calcStats(aVals),
        typeStats:      typeStats
    };
}

/* ═══════════════════════════════════════════════════════════════
   FETCH
   ═══════════════════════════════════════════════════════════════ */
function fetchAllData() {
    var base = '../RESEARCH-DATA/investigation 2/fields';
    var results = {}, done = 0, total = subjects.length;

    subjects.forEach(function(subject) {
        fetch(base + '/' + subject + '/skipped')
        .then(function(r){ return r.ok ? r.text() : null; })
        .then(function(txt) {
            var skipped = txt ? txt.trim() : null;
            return Promise.all([
                fetch(base + '/' + subject + '/ssi_of_questions').then(function(r){ return r.json(); }),
                fetch(base + '/' + subject + '/ssi_of_answers').then(function(r){ return r.json(); })
            ]).then(function(pair) {
                results[subject] = analyzeSubject(pair[0], pair[1], skipped);
                results[subject].skippedType = skipped;
                if (++done === total) renderResults(results);
            });
        })
        .catch(function(e){ console.error(subject, e); if (++done === total) renderResults(results); });
    });
}

/* ═══════════════════════════════════════════════════════════════
   GRAPH
   ═══════════════════════════════════════════════════════════════ */
function drawGraph(results) {
    var canvas = document.getElementById('ssi-graph');
    if (!canvas) return;
    var ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    var M = { top:36, right:36, bottom:96, left:74 };
    var pw = W - M.left - M.right, ph = H - M.top - M.bottom;

    var allR = [];
    var avgByType = {};
    questionTypes.forEach(function(t) {
        var vals = [];
        subjects.forEach(function(s) {
            var ts = results[s].typeStats[t];
            if (ts && ts.ratioStats.n > 0) { allR.push(ts.avgRatio); vals.push(ts.avgRatio); }
        });
        if (vals.length) { avgByType[t] = calcStats(vals).mean; allR.push(avgByType[t]); }
    });

    var range = Math.max.apply(null, allR) - Math.min.apply(null, allR);
    var yMin = Math.min.apply(null, allR) - range * 0.1;
    var yMax = Math.max.apply(null, allR) + range * 0.1;

    function yPx(v) { return M.top + ph - ((v - yMin) / (yMax - yMin)) * ph; }
    var xStep = pw / (questionTypes.length - 1);
    function xPx(i) { return M.left + xStep * i; }

    /* axes */
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(M.left, M.top); ctx.lineTo(M.left, H - M.bottom); ctx.lineTo(W - M.right, H - M.bottom); ctx.stroke();

    /* grid + y labels */
    var nGrid = 7;
    for (var i = 0; i <= nGrid; i++) {
        var yy = M.top + (ph / nGrid) * i;
        ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(M.left, yy); ctx.lineTo(W - M.right, yy); ctx.stroke();
        var val = yMax - (yMax - yMin) * (i / nGrid);
        ctx.fillStyle = '#555'; ctx.font = '11px Consolas, monospace'; ctx.textAlign = 'right';
        ctx.fillText(val.toFixed(3), M.left - 8, yy + 4);
    }

    /* x labels (rotated) */
    ctx.fillStyle = '#333'; ctx.font = '11px Segoe UI, sans-serif'; ctx.textAlign = 'left';
    questionTypes.forEach(function(t, i) {
        ctx.save();
        ctx.translate(xPx(i), H - M.bottom + 10);
        ctx.rotate(-Math.PI / 4.5);
        ctx.fillText(shortLabels[t] || t, 0, 0);
        ctx.restore();
    });

    /* axis labels */
    ctx.font = 'bold 12px Georgia, serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#1a1a1a';
    ctx.fillText('Question Type  →  Increasing Stability', W / 2, H - 6);
    ctx.save(); ctx.translate(16, H / 2); ctx.rotate(-Math.PI / 2);
    ctx.fillText('SSI Ratio (Answer / Question)', 0, 0); ctx.restore();

    /* subject lines */
    subjects.forEach(function(s) {
        if (!subjectVisibility[s]) return;
        var ts = results[s].typeStats, col = subjectColors[s];
        ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash([]);
        var last = null;
        questionTypes.forEach(function(t, i) {
            if (ts[t] && ts[t].ratioStats.n > 0) {
                var pt = { x: xPx(i), y: yPx(ts[t].avgRatio) };
                if (last) { ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(pt.x, pt.y); ctx.stroke(); }
                last = pt;
            } else { last = null; }
        });
        ctx.fillStyle = col;
        questionTypes.forEach(function(t, i) {
            if (ts[t] && ts[t].ratioStats.n > 0) {
                ctx.beginPath(); ctx.arc(xPx(i), yPx(ts[t].avgRatio), 3.5, 0, Math.PI * 2); ctx.fill();
            }
        });
    });

    /* average dashed line */
    if (showAverageLine) {
        ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2.5; ctx.setLineDash([7, 4]);
        var last = null;
        questionTypes.forEach(function(t, i) {
            if (avgByType[t] != null) {
                var pt = { x: xPx(i), y: yPx(avgByType[t]) };
                if (last) { ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(pt.x, pt.y); ctx.stroke(); }
                last = pt;
            } else { last = null; }
        });
        ctx.setLineDash([]); ctx.fillStyle = '#1a1a1a';
        questionTypes.forEach(function(t, i) {
            if (avgByType[t] != null) { ctx.beginPath(); ctx.arc(xPx(i), yPx(avgByType[t]), 4.5, 0, Math.PI * 2); ctx.fill(); }
        });
    }
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════ */
function renderResults(results) {
    globalResults = results;

    /* ── pre-compute z-scores ── */
    questionTypes.forEach(function(t) {
        var vals = [];
        subjects.forEach(function(s) { var ts = results[s].typeStats[t]; if (ts && ts.ratioStats.n > 0) vals.push(ts.avgRatio); });
        var st = calcStats(vals);
        subjects.forEach(function(s) {
            var ts = results[s].typeStats[t];
            if (ts && ts.ratioStats.n > 0) ts.zScore = zScoreVal(ts.avgRatio, st.mean, st.stdDev);
        });
    });
    var overallRatios = subjects.map(function(s){ return results[s].avgRatio; });
    var overallSt = calcStats(overallRatios);
    subjects.forEach(function(s){ results[s].zScore = zScoreVal(results[s].avgRatio, overallSt.mean, overallSt.stdDev); });

    var sorted = subjects.slice().sort(function(a,b){ return results[b].avgRatio - results[a].avgRatio; });

    var h = '';

    /* ════════ 1. LINE GRAPH ════════ */
    h += '<h2>Figure 1 — SSI Ratio Trends Across Question Types</h2>';

    h += '<div class="toggle-bar"><span class="toggle-bar-label">Display</span>';
    h += '<label><input type="checkbox" checked onchange="toggleAverageLine()"> Average</label>';
    subjects.forEach(function(s) {
        h += '<label><input type="checkbox" checked onchange="toggleSubject(\'' + s + '\')"><span style="color:' + subjectColors[s] + ';font-weight:600;">' + s + '</span></label>';
    });
    h += '</div>';

    h += '<div class="graph-with-bar"><div class="graph-main">';
    h += '<div id="graph-container">';
    h += '<div class="graph-title">SSI Ratio by Question Type</div>';
    h += '<canvas id="ssi-graph" width="1400" height="560"></canvas>';

    h += '<div class="legend">';
    h += '<div class="legend-item"><div class="legend-swatch-dashed"></div><span><strong>Average</strong></span></div>';
    subjects.forEach(function(s) {
        h += '<div class="legend-item"><div class="legend-swatch" style="background:' + subjectColors[s] + ';"></div><span>' + s + '</span></div>';
    });
    h += '</div>';
    h += '<p class="graph-caption">Each line traces a subject\'s mean answer/question SSI ratio across question types, ordered left to right by increasing stability.</p>';
    h += '</div></div>';

    h += '<div class="average-bar-container">';
    h += '<div class="average-bar-title">Overall<br>Avg Ratio</div>';
    h += '<div class="average-bar-scale" id="average-scale"><div class="average-bar-axis"></div></div>';
    h += '<div class="average-bar-tooltip" id="bar-tooltip"></div>';
    h += '</div></div>';

    /* ════════ 2. CROSS-SUBJECT TABLE ════════ */
    h += '<h2>Table 1 — SSI Ratios by Subject and Question Type</h2>';
    h += '<p style="font-size:13px;color:#555;margin-bottom:10px;font-style:italic;">Green = highest per row; red = lowest. Z-scores in parentheses.</p>';
    h += '<table><thead><tr><th style="width:160px;">Question Type</th>';
    subjects.forEach(function(s){ h += '<th class="text-right">' + s + '</th>'; });
    h += '</tr></thead><tbody>';

    questionTypes.forEach(function(t) {
        var vals = [];
        subjects.forEach(function(s) { var ts = results[s].typeStats[t]; if (ts && ts.ratioStats.n > 0) vals.push(ts.avgRatio); });
        var mx = vals.length ? Math.max.apply(null, vals) : null;
        var mn = vals.length ? Math.min.apply(null, vals) : null;

        h += '<tr><td><strong>' + t + '</strong></td>';
        subjects.forEach(function(s) {
            var ts = results[s].typeStats[t];
            if (ts && ts.ratioStats.n > 0) {
                var v = ts.avgRatio, z = ts.zScore || 0;
                var cls = (v === mx ? 'highlight-max' : (v === mn ? 'highlight-min' : ''));
                h += '<td class="text-right ' + cls + '"><span class="font-mono">' + v.toFixed(4) + '</span> <span class="' + zClass(z) + '" style="font-size:11px;">(z=' + z.toFixed(2) + ')</span></td>';

        h += '<table><thead><tr><th>Question</th><th>Answer</th><th>Type</th><th class="text-right">Q SSI</th><th class="text-right">A SSI</th><th class="text-right">Ratio</th></tr></thead><tbody>';

    var subScores  = computeSubjectScores(results);

    h += '</div>'; // rankings-wrap

    h += '<p style="font-size:12px;color:#666;margin-bottom:10px;font-style:italic;">Composite score (0–100): Ratio (0.40) + Z-Score (0.30) + Consistency (0.30). All components are normalised to [0, 1] before weighting.</p>';

    h += '<table><thead><tr><th>Rank</th><th>Subject</th><th class="text-right">Avg Ratio</th><th class="text-right">Avg Z-Score</th><th class="text-right">Consistency</th><th class="text-right" style="background:#1a1a1a;color:#fff;">Score</th></tr></thead><tbody>';

        h += '<tr><td>' + (i+1) + '</td>' +
             '<td><strong style="color:' + subjectColors[row.subject] + ';">' + row.subject + '</strong></td>' +
             '<td class="text-right font-mono">' + row.avgRatio.toFixed(4) + '</td>' +
             '<td class="text-right font-mono ' + zClass(row.avgZ) + '">' + row.avgZ.toFixed(3) + '</td>' +
             '<td class="text-right font-mono">' + row.avgConsis.toFixed(4) + '</td>' +

    h += '</tbody></table>';

    h += '<div class="panel-label" style="margin-top:24px;">Table 4 — Question Type Scores</div>';
    h += '<p style="font-size:12px;color:#666;margin-bottom:10px;font-style:italic;">Same scoring methodology applied per question type, aggregated across all subjects that include each type.</p>';

    h += '<table><thead><tr><th>Rank</th><th>Question Type</th><th class="text-right">Avg Ratio</th><th class="text-right">Avg Z-Score</th><th class="text-right">Consistency</th><th class="text-right" style="background:#1a1a1a;color:#fff;">Score</th><th class="text-right">Subjects</th></tr></thead><tbody>';
    typeScores.forEach(function(row, i) {
        h += '<tr><td>' + (i+1) + '</td>' +
             '<td><strong>' + row.type + '</strong></td>' +
             '<td class="text-right font-mono">' + row.avgRatio.toFixed(4) + '</td>' +
             '<td class="text-right font-mono ' + zClass(row.avgZ) + '">' + row.avgZ.toFixed(3) + '</td>' +
             '<td class="text-right font-mono">' + row.avgConsis.toFixed(4) + '</td>' +
             '<td class="text-right font-mono font-bold score-col">' + row.score.toFixed(1) + '</td>' +
             '<td class="text-right">' + row.count + '</td></tr>';
    });
    h += '</tbody></table>';

    h += '</div></div>'; /* dashboard-body, dashboard */

    /* ─── inject ─── */
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('content').innerHTML = h;
    document.getElementById('content').classList.remove('hidden');

    setTimeout(function(){ drawGraph(results); populateAverageBar(results); }, 80);
}

/* ─── toggle helper ─── */
function toggleCalc(id) {
    var el = document.getElementById(id);
    var btn = document.querySelector('button[data-target="' + id + '"]');
    if (el.classList.contains('hidden')) { el.classList.remove('hidden'); btn.textContent = 'Hide Calculations'; }
    else { el.classList.add('hidden'); btn.textContent = 'Show Calculations'; }
}

/* ─── average bar ─── */
function populateAverageBar(results) {
    var scale = document.getElementById('average-scale');
    if (!scale) return;
    var vals = subjects.map(function(s){ return results[s].avgRatio; });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), rng = mx - mn;
    var yMin = mn - rng * 0.12, yMax = mx + rng * 0.12;
    var sh = scale.offsetHeight;

    subjects.forEach(function(s) {
        var ratio = results[s].avgRatio, col = subjectColors[s];
        var top = sh * (1 - (ratio - yMin) / (yMax - yMin));

        var dot = document.createElement('div');
        dot.className = 'average-bar-dot';
        dot.style.backgroundColor = col;
        dot.style.top = top + 'px';
        dot.setAttribute('data-subject', s);
        dot.setAttribute('data-ratio', ratio.toFixed(4));
        dot.addEventListener('mouseenter', function(e) {
            var tip = document.getElementById('bar-tooltip');
            tip.textContent = e.target.getAttribute('data-subject') + ': ' + e.target.getAttribute('data-ratio');
            tip.style.display = 'block';
            tip.style.left = (e.target.offsetLeft + 22) + 'px';
            tip.style.top = e.target.offsetTop + 'px';
        });
        dot.addEventListener('mouseleave', function(){ document.getElementById('bar-tooltip').style.display = 'none'; });
        scale.appendChild(dot);

        var lbl = document.createElement('div');
        lbl.className = 'average-bar-label';
        lbl.style.color = col;
        lbl.style.top = top + 'px';
        lbl.textContent = s.substring(0, 3);
        scale.appendChild(lbl);
    });
}

fetchAllData();
</script>
</body>
</html>
