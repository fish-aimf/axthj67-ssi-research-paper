<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSI Data Analyzer - Investigation 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: #f8f9fa;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #1a1a1a;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 15px;
            margin-top: 30px;
            color: #2c3e50;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 8px;
        }
        h3 {
            font-size: 18px;
            margin-bottom: 12px;
            margin-top: 20px;
            color: #34495e;
        }
        .info {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .loading {
            text-align: center;
            padding: 80px;
            font-size: 20px;
            color: #666;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f5f5f5;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .text-right {
            text-align: right;
        }
        .section {
            margin-bottom: 50px;
            border: 1px solid #e0e0e0;
            padding: 25px;
            border-radius: 6px;
            background: #fafafa;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 4px;
            background: white;
        }
        .stat-box div {
            font-size: 14px;
            margin-bottom: 5px;
        }
        button {
            padding: 10px 20px;
            border: 1px solid #3498db;
            background: #3498db;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover {
            background: #2980b9;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calculations {
            margin-top: 20px;
        }
        .hidden {
            display: none;
        }
        .font-medium {
            font-weight: 600;
        }
        .bg-gray {
            background-color: #f9f9f9;
        }
        
        /* Graph Styles */
        .graph-section {
            margin-bottom: 40px;
        }
        
        #graph-container {
            width: 100%;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 30px;
            box-sizing: border-box;
        }
        
        .graph-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .graph-subtitle {
            text-align: center;
            font-size: 15px;
            color: #666;
            margin-bottom: 25px;
        }
        
        #bar-chart {
            width: 100%;
            height: 800px;
            max-width: 1131px;
            margin: 0 auto;
            display: block;
        }
        
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        
        .summary-card {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }
        
        .summary-card .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .summary-card .value {
            font-size: 24px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .summary-card .subvalue {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        /* Comparison Grid */
        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        
        .comparison-card {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 20px;
            background: white;
        }
        
        .comparison-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #2c3e50;
            font-size: 16px;
        }
        
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .metric-row:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            font-size: 13px;
            color: #666;
        }
        
        .metric-value {
            font-size: 13px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .highlight-highest {
            background-color: #d4edda;
            font-weight: 600;
        }
        
        .highlight-lowest {
            background-color: #f8d7da;
        }
        
        .z-positive {
            color: #27ae60;
        }
        
        .z-negative {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SSI Data Analyzer - Investigation 1</h1>
        <div class="info">Data loaded from: RESEARCH-DATA/investigation 1/question-types</div>
        
        <div id="loading" class="loading">Loading data from GitHub...</div>
        <div id="content" class="hidden"></div>
    </div>

    <script>
        var questionTypes = [
            'analytical-multistep-reasoning',
            'procedural-how-to',
            'design-methodological',
            'evaluative-normative',
            'interpretive-contextual',
            'computational-numerical',
            'closed-factual',
            'conceptual-definition'
        ];
        
        // Define vibrant, distinct colors for each question type
        var typeColors = {
            'analytical-multistep-reasoning': '#e74c3c',
            'procedural-how-to': '#3498db',
            'design-methodological': '#2ecc71',
            'evaluative-normative': '#f39c12',
            'interpretive-contextual': '#9b59b6',
            'computational-numerical': '#1abc9c',
            'closed-factual': '#e67e22',
            'conceptual-definition': '#34495e'
        };

        function calculateStats(values) {
            var n = values.length;
            if (n === 0) return { mean: 0, stdDev: 0, min: 0, max: 0, n: 0 };
            
            var sum = 0;
            for (var i = 0; i < values.length; i++) {
                sum += values[i];
            }
            var mean = sum / n;
            
            var varianceSum = 0;
            for (var i = 0; i < values.length; i++) {
                varianceSum += Math.pow(values[i] - mean, 2);
            }
            var variance = varianceSum / n;
            var stdDev = Math.sqrt(variance);
            var min = Math.min.apply(null, values);
            var max = Math.max.apply(null, values);
            
            return { mean: mean, stdDev: stdDev, min: min, max: max, n: n };
        }

        function analyzeQuestionType(questions, answers) {
            var questionKeys = Object.keys(questions).sort(function(a, b) {
                var numA = parseInt(a.substring(1));
                var numB = parseInt(b.substring(1));
                return numA - numB;
            });
            
            var answerKeys = Object.keys(answers).sort(function(a, b) {
                var numA = parseInt(a.substring(1));
                var numB = parseInt(b.substring(1));
                return numA - numB;
            });

            var ratios = [];
            var calculations = [];

            for (var i = 0; i < questionKeys.length; i++) {
                var qKey = questionKeys[i];
                var aKey = answerKeys[i];
                var qValue = questions[qKey];
                var aValue = answers[aKey];
                var ratio = aValue / qValue;
                
                ratios.push(ratio);
                calculations.push({
                    question: qKey,
                    answer: aKey,
                    questionSSI: qValue,
                    answerSSI: aValue,
                    ratio: ratio
                });
            }

            var questionValues = [];
            for (var k in questions) {
                if (questions.hasOwnProperty(k)) {
                    questionValues.push(questions[k]);
                }
            }
            
            var answerValues = [];
            for (var k in answers) {
                if (answers.hasOwnProperty(k)) {
                    answerValues.push(answers[k]);
                }
            }
            
            var qSum = 0;
            for (var i = 0; i < questionValues.length; i++) {
                qSum += questionValues[i];
            }
            var avgQuestionSSI = questionValues.length > 0 ? qSum / questionValues.length : 0;
            
            var aSum = 0;
            for (var i = 0; i < answerValues.length; i++) {
                aSum += answerValues[i];
            }
            var avgAnswerSSI = answerValues.length > 0 ? aSum / answerValues.length : 0;
            
            var rSum = 0;
            for (var i = 0; i < ratios.length; i++) {
                rSum += ratios[i];
            }
            var avgRatio = ratios.length > 0 ? rSum / ratios.length : 0;
            
            var ratioStats = calculateStats(ratios);
            var questionStats = calculateStats(questionValues);
            var answerStats = calculateStats(answerValues);

            return {
                calculations: calculations,
                avgQuestionSSI: avgQuestionSSI,
                avgAnswerSSI: avgAnswerSSI,
                avgRatio: avgRatio,
                ratioStats: ratioStats,
                questionStats: questionStats,
                answerStats: answerStats,
                zScore: 0 // Will be calculated later
            };
        }

        function toggleCalculations(id) {
            var elem = document.getElementById(id);
            if (elem.classList.contains('hidden')) {
                elem.classList.remove('hidden');
            } else {
                elem.classList.add('hidden');
            }
            var button = document.querySelector('button[data-target="' + id + '"]');
            if (elem.classList.contains('hidden')) {
                button.textContent = 'Show Detailed Calculations';
            } else {
                button.textContent = 'Hide Detailed Calculations';
            }
        }

        function fetchAllData() {
            var baseUrl = '../RESEARCH-DATA/investigation 1/question-types';
            var results = {};
            var completed = 0;
            var total = questionTypes.length;
            
            for (var i = 0; i < questionTypes.length; i++) {
                (function(qt) {
                    var questionsUrl = baseUrl + '/' + qt + '/ssi_of_questions';
                    var answersUrl = baseUrl + '/' + qt + '/ssi_of_answers';
                    
                    fetch(questionsUrl)
                        .then(function(r) { return r.json(); })
                        .then(function(questionsData) {
                            return fetch(answersUrl)
                                .then(function(r) { return r.json(); })
                                .then(function(answersData) {
                                    results[qt] = analyzeQuestionType(questionsData, answersData);
                                    completed++;
                                    if (completed === total) {
                                        renderResults(results);
                                    }
                                });
                        })
                        .catch(function(err) {
                            console.error('Error fetching ' + qt + ':', err);
                            completed++;
                            if (completed === total) {
                                renderResults(results);
                            }
                        });
                })(questionTypes[i]);
            }
        }
        
        function drawBarChart(results) {
            var canvas = document.getElementById('bar-chart');
            var ctx = canvas.getContext('2d');
            
            // A4 landscape dimensions (1131 x 800 pixels)
            var width = 1131;
            var height = 800;
            canvas.width = width;
            canvas.height = height;
            
            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Margins - adjusted for A4 landscape with larger fonts
            var margin = { top: 100, right: 120, bottom: 180, left: 100 };
            var plotWidth = width - margin.left - margin.right;
            var plotHeight = height - margin.top - margin.bottom;
            
            // Prepare data sorted by ratio
            var entries = [];
            for (var i = 0; i < questionTypes.length; i++) {
                var type = questionTypes[i];
                if (results[type]) {
                    entries.push({
                        type: type,
                        ratio: results[type].avgRatio,
                        zScore: results[type].zScore,
                        color: typeColors[type]
                    });
                }
            }
            
            // Sort by ratio (descending)
            entries.sort(function(a, b) {
                return b.ratio - a.ratio;
            });
            
            // Find min and max ratio for optimized scaling
            var maxRatio = 0;
            var minRatio = Infinity;
            for (var i = 0; i < entries.length; i++) {
                if (entries[i].ratio > maxRatio) {
                    maxRatio = entries[i].ratio;
                }
                if (entries[i].ratio < minRatio) {
                    minRatio = entries[i].ratio;
                }
            }
            
            // Optimized axis scale - start from 90% of min value instead of 0
            var yMin = minRatio * 0.90;
            var yMax = maxRatio * 1.08; // Reduced padding since we're not starting from 0
            var yRange = yMax - yMin;
            
            // Calculate bar dimensions
            var barWidth = plotWidth / entries.length * 0.7;
            var barSpacing = plotWidth / entries.length;
            
            // Draw axes
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(margin.left, margin.top);
            ctx.lineTo(margin.left, height - margin.bottom);
            ctx.lineTo(width - margin.right, height - margin.bottom);
            ctx.stroke();
            
            // Draw horizontal grid lines
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1.5;
            var numYGridLines = 6; // Reduced from 8 to save space
            for (var i = 0; i <= numYGridLines; i++) {
                var y = margin.top + (plotHeight / numYGridLines) * i;
                ctx.beginPath();
                ctx.moveTo(margin.left, y);
                ctx.lineTo(width - margin.right, y);
                ctx.stroke();
                
                // Y-axis labels - 50% LARGER FONT (14 * 1.5 = 21)
                var value = yMax - (yRange * (i / numYGridLines));
                ctx.fillStyle = '#333';
                ctx.font = 'bold 21px Arial';
                ctx.textAlign = 'right';
                ctx.fillText(value.toFixed(3), margin.left - 12, y + 7);
            }
            
            // Draw bars with Z-score indicators
            for (var i = 0; i < entries.length; i++) {
                var entry = entries[i];
                var x = margin.left + (i * barSpacing) + (barSpacing - barWidth) / 2;
                var barHeight = ((entry.ratio - yMin) / yRange) * plotHeight;
                var y = height - margin.bottom - barHeight;
                
                // Draw bar with solid color
                ctx.fillStyle = entry.color;
                ctx.fillRect(x, y, barWidth, barHeight);
                
                // Draw bar border
                ctx.strokeStyle = entry.color;
                ctx.lineWidth = 2.5;
                ctx.strokeRect(x, y, barWidth, barHeight);
                
                // Draw ratio value on top of bar - 50% LARGER FONT (15 * 1.5 = 22.5)
                ctx.fillStyle = '#000';
                ctx.font = 'bold 23px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(entry.ratio.toFixed(4), x + barWidth / 2, y - 45);
                
                // Draw Z-score below ratio - 50% LARGER FONT (14 * 1.5 = 21)
                var zScoreColor = entry.zScore >= 0 ? '#27ae60' : '#e74c3c';
                ctx.fillStyle = zScoreColor;
                ctx.font = 'bold 21px Arial';
                ctx.fillText('Z: ' + entry.zScore.toFixed(2), x + barWidth / 2, y - 20);
                
                // Draw x-axis labels (rotated) - 50% LARGER FONT (13 * 1.5 = 19.5)
                ctx.save();
                ctx.translate(x + barWidth / 2, height - margin.bottom + 25);
                ctx.rotate(-Math.PI / 3.2);
                ctx.fillStyle = entry.color;
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'right';
                ctx.fillText(entry.type, 0, 0);
                ctx.restore();
            }
            
            // Y-axis label - 50% LARGER FONT (16 * 1.5 = 24)
            ctx.save();
            ctx.translate(30, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.font = 'bold 24px Arial';
            ctx.fillStyle = '#333';
            ctx.textAlign = 'center';
            ctx.fillText('Average SSI Ratio (Answer/Question)', 0, 0);
            ctx.restore();
            
            // Draw average line
            var totalRatio = 0;
            for (var i = 0; i < entries.length; i++) {
                totalRatio += entries[i].ratio;
            }
            var avgRatio = totalRatio / entries.length;
            var avgY = height - margin.bottom - ((avgRatio - yMin) / yRange) * plotHeight;
            
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 3.5;
            ctx.setLineDash([12, 6]);
            ctx.beginPath();
            ctx.moveTo(margin.left, avgY);
            ctx.lineTo(width - margin.right, avgY);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Draw average label - 50% LARGER FONT (14 * 1.5 = 21) - positioned to not get cut off
            ctx.fillStyle = '#e74c3c';
            ctx.font = 'bold 21px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('Avg: ' + avgRatio.toFixed(4), width - margin.right + 10, avgY + 8);
            
            // Add legend for Z-score colors - 50% LARGER FONT (13 * 1.5 = 19.5)
            var legendY = 30;
            ctx.font = 'bold 20px Arial';
            ctx.fillStyle = '#27ae60';
            ctx.fillText('● Positive Z-score (above average)', margin.left + 10, legendY);
            ctx.fillStyle = '#e74c3c';
            ctx.fillText('● Negative Z-score (below average)', margin.left + 10, legendY + 30);
        }

        function renderResults(results) {
            var entries = [];
            for (var key in results) {
                if (results.hasOwnProperty(key)) {
                    entries.push([key, results[key]]);
                }
            }
            entries.sort(function(a, b) {
                return b[1].avgRatio - a[1].avgRatio;
            });
            
            // Calculate z-scores
            var allRatios = [];
            for (var i = 0; i < entries.length; i++) {
                allRatios.push(entries[i][1].avgRatio);
            }
            var overallMean = calculateStats(allRatios).mean;
            var overallStdDev = calculateStats(allRatios).stdDev;
            
            for (var i = 0; i < entries.length; i++) {
                entries[i][1].zScore = (entries[i][1].avgRatio - overallMean) / overallStdDev;
            }
            
            // Calculate overall statistics
            var allQuestionSSI = [];
            var allAnswerSSI = [];
            for (var i = 0; i < entries.length; i++) {
                allQuestionSSI.push(entries[i][1].avgQuestionSSI);
                allAnswerSSI.push(entries[i][1].avgAnswerSSI);
            }
            
            var overallStats = {
                avgRatio: overallMean,
                avgQuestionSSI: calculateStats(allQuestionSSI).mean,
                avgAnswerSSI: calculateStats(allAnswerSSI).mean,
                highestRatio: entries[0],
                lowestRatio: entries[entries.length - 1]
            };
            
            var html = '<div class="graph-section">';
            html += '<h2>SSI Ratio Comparison Across Question Types</h2>';
            html += '<div id="graph-container">';
            html += '<div class="graph-title">Average SSI Ratio by Question Type</div>';
            html += '<div class="graph-subtitle">Higher ratios indicate answers with greater semantic specificity. Z-scores show deviation from mean.</div>';
            html += '<canvas id="bar-chart"></canvas>';
            
            // Stats summary
            html += '<div class="stats-summary">';
            html += '<div class="summary-card">';
            html += '<div class="label">Overall Average</div>';
            html += '<div class="value">' + overallStats.avgRatio.toFixed(4) + '</div>';
            html += '<div class="subvalue">SSI Ratio</div>';
            html += '</div>';
            
            html += '<div class="summary-card">';
            html += '<div class="label">Highest Ratio</div>';
            html += '<div class="value" style="color: ' + typeColors[overallStats.highestRatio[0]] + ';">' + overallStats.highestRatio[1].avgRatio.toFixed(4) + '</div>';
            html += '<div class="subvalue">' + overallStats.highestRatio[0] + '</div>';
            html += '</div>';
            
            html += '<div class="summary-card">';
            html += '<div class="label">Lowest Ratio</div>';
            html += '<div class="value" style="color: ' + typeColors[overallStats.lowestRatio[0]] + ';">' + overallStats.lowestRatio[1].avgRatio.toFixed(4) + '</div>';
            html += '<div class="subvalue">' + overallStats.lowestRatio[0] + '</div>';
            html += '</div>';
            
            html += '<div class="summary-card">';
            html += '<div class="label">Range</div>';
            html += '<div class="value">' + (overallStats.highestRatio[1].avgRatio - overallStats.lowestRatio[1].avgRatio).toFixed(4) + '</div>';
            html += '<div class="subvalue">Difference</div>';
            html += '</div>';
            
            html += '</div>'; // stats-summary
            html += '</div>'; // graph-container
            html += '</div>'; // graph-section
            
            // Comparison grid
            html += '<h2>Key Comparisons</h2>';
            html += '<div class="comparison-grid">';
            
            // All entries sorted by ratio
            html += '<div class="comparison-card">';
            html += '<h3>Highest vs Lowest SSI Ratios</h3>';
            for (var i = 0; i < entries.length; i++) {
                var name = entries[i][0];
                html += '<div class="metric-row">';
                html += '<span class="metric-label" style="color: ' + typeColors[name] + ';">▪ ' + name + '</span>';
                html += '<span class="metric-value">' + entries[i][1].avgRatio.toFixed(4) + '</span>';
                html += '</div>';
            }
            html += '</div>';
            
            // Variability comparison - all entries
            html += '<div class="comparison-card">';
            html += '<h3>Variability (Standard Deviation)</h3>';
            var stdDevEntries = entries.slice().sort(function(a, b) {
                return b[1].ratioStats.stdDev - a[1].ratioStats.stdDev;
            });
            for (var i = 0; i < stdDevEntries.length; i++) {
                var name = stdDevEntries[i][0];
                html += '<div class="metric-row">';
                html += '<span class="metric-label" style="color: ' + typeColors[name] + ';">▪ ' + name + '</span>';
                html += '<span class="metric-value">' + stdDevEntries[i][1].ratioStats.stdDev.toFixed(4) + '</span>';
                html += '</div>';
            }
            html += '</div>';
            
            html += '</div>'; // comparison-grid
            
            html += '<h2>Detailed Rankings</h2>';
            html += '<table><thead><tr class="bg-gray"><th>Rank</th><th>Question Type</th><th class="text-right">Avg Question SSI</th><th class="text-right">Avg Answer SSI</th><th class="text-right">Avg SSI Ratio</th><th class="text-right">Z-Score</th><th class="text-right">Ratio Std Dev</th></tr></thead><tbody>';
            
            for (var idx = 0; idx < entries.length; idx++) {
                var name = entries[idx][0];
                var data = entries[idx][1];
                var rowClass = '';
                if (idx === 0) rowClass = 'highlight-highest';
                else if (idx === entries.length - 1) rowClass = 'highlight-lowest';
                
                var zClass = data.zScore >= 0 ? 'z-positive' : 'z-negative';
                
                html += '<tr class="' + rowClass + '">' +
                    '<td>' + (idx + 1) + '</td>' +
                    '<td><strong style="color: ' + typeColors[name] + ';">▪ ' + name + '</strong></td>' +
                    '<td class="text-right">' + data.avgQuestionSSI.toFixed(4) + '</td>' +
                    '<td class="text-right">' + data.avgAnswerSSI.toFixed(4) + '</td>' +
                    '<td class="text-right font-medium">' + data.avgRatio.toFixed(4) + '</td>' +
                    '<td class="text-right font-medium ' + zClass + '">' + data.zScore.toFixed(3) + '</td>' +
                    '<td class="text-right">' + data.ratioStats.stdDev.toFixed(4) + '</td>' +
                '</tr>';
            }
            
            html += '</tbody></table>';
            
            // Detailed sections
            for (var idx = 0; idx < entries.length; idx++) {
                var name = entries[idx][0];
                var data = entries[idx][1];
                var id = 'calc-' + name;
                
                html += '<div class="section">' +
                    '<div class="section-header">' +
                        '<h2 style="color: ' + typeColors[name] + ';">▪ ' + name + '</h2>' +
                        '<button data-target="' + id + '" onclick="toggleCalculations(\'' + id + '\')">Show Detailed Calculations</button>' +
                    '</div>' +
                    '<div class="stats-grid">' +
                        '<div class="stat-box">' +
                            '<h3>Question SSI Statistics</h3>' +
                            '<div>Mean: ' + data.questionStats.mean.toFixed(4) + '</div>' +
                            '<div>Std Dev: ' + data.questionStats.stdDev.toFixed(4) + '</div>' +
                            '<div>Min: ' + data.questionStats.min.toFixed(4) + '</div>' +
                            '<div>Max: ' + data.questionStats.max.toFixed(4) + '</div>' +
                            '<div>Count: ' + data.questionStats.n + '</div>' +
                        '</div>' +
                        '<div class="stat-box">' +
                            '<h3>Answer SSI Statistics</h3>' +
                            '<div>Mean: ' + data.answerStats.mean.toFixed(4) + '</div>' +
                            '<div>Std Dev: ' + data.answerStats.stdDev.toFixed(4) + '</div>' +
                            '<div>Min: ' + data.answerStats.min.toFixed(4) + '</div>' +
                            '<div>Max: ' + data.answerStats.max.toFixed(4) + '</div>' +
                            '<div>Count: ' + data.answerStats.n + '</div>' +
                        '</div>' +
                        '<div class="stat-box">' +
                            '<h3>SSI Ratio Statistics</h3>' +
                            '<div>Mean: ' + data.ratioStats.mean.toFixed(4) + '</div>' +
                            '<div>Std Dev: ' + data.ratioStats.stdDev.toFixed(4) + '</div>' +
                            '<div>Min: ' + data.ratioStats.min.toFixed(4) + '</div>' +
                            '<div>Max: ' + data.ratioStats.max.toFixed(4) + '</div>' +
                            '<div>Count: ' + data.ratioStats.n + '</div>' +
                        '</div>' +
                        '<div class="stat-box">' +
                            '<h3>Z-Score Analysis</h3>' +
                            '<div>Z-Score: <span class="' + (data.zScore >= 0 ? 'z-positive' : 'z-negative') + '">' + data.zScore.toFixed(3) + '</span></div>' +
                            '<div>' + (data.zScore > 0 ? 'Above' : 'Below') + ' average</div>' +
                            '<div>' + (Math.abs(data.zScore) > 1 ? 'Significant deviation' : 'Within 1 SD') + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div id="' + id + '" class="calculations hidden">' +
                        '<h3>Individual Question Calculations</h3>' +
                        '<table>' +
                            '<thead>' +
                                '<tr class="bg-gray">' +
                                    '<th>Question</th>' +
                                    '<th>Answer</th>' +
                                    '<th class="text-right">Question SSI</th>' +
                                    '<th class="text-right">Answer SSI</th>' +
                                    '<th class="text-right">Ratio (A/Q)</th>' +
                                '</tr>' +
                            '</thead>' +
                            '<tbody>';
                
                for (var c = 0; c < data.calculations.length; c++) {
                    var calc = data.calculations[c];
                    html += '<tr>' +
                        '<td>' + calc.question + '</td>' +
                        '<td>' + calc.answer + '</td>' +
                        '<td class="text-right">' + calc.questionSSI.toFixed(6) + '</td>' +
                        '<td class="text-right">' + calc.answerSSI.toFixed(6) + '</td>' +
                        '<td class="text-right font-medium">' + calc.ratio.toFixed(6) + '</td>' +
                    '</tr>';
                }
                
                html += '<tr class="bg-gray font-medium">' +
                    '<td colspan="2">AVERAGE</td>' +
                    '<td class="text-right">' + data.avgQuestionSSI.toFixed(6) + '</td>' +
                    '<td class="text-right">' + data.avgAnswerSSI.toFixed(6) + '</td>' +
                    '<td class="text-right">' + data.avgRatio.toFixed(6) + '</td>' +
                '</tr>' +
                            '</tbody>' +
                        '</table>' +
                    '</div>' +
                '</div>';
            }
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').innerHTML = html;
            document.getElementById('content').classList.remove('hidden');
            
            // Draw the bar chart after rendering
            setTimeout(function() {
                drawBarChart(results);
            }, 100);
        }

        fetchAllData();
    </script>
</body>
</html>
