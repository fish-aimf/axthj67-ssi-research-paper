<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSI Ratio Analysis - A4 Graph</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .a4-container {
            width: 210mm;
            height: 297mm;
            background: white;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            padding: 40px;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #000;
            padding-bottom: 20px;
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #000;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .header .subtitle {
            font-size: 16px;
            color: #666;
            font-weight: 400;
        }
        
        .chart-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        
        #main-chart {
            width: 100%;
            height: 600px;
        }
        
        .stats-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #000;
        }
        
        .stat-card .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 600;
        }
        
        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            font-family: 'IBM Plex Mono', monospace;
        }
        
        .stat-card .subvalue {
            font-size: 10px;
            color: #999;
            margin-top: 4px;
        }
        
        .legend {
            margin-top: 20px;
            padding: 15px;
            background: #fafafa;
            border-radius: 6px;
        }
        
        .legend-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .legend-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 11px;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            margin-right: 8px;
            border: 1px solid rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="a4-container">
        <div class="header">
            <h1>SSI Ratio Analysis by Question Type</h1>
            <div class="subtitle">Average Answer-to-Question SSI Ratio Comparison</div>
        </div>
        
        <div class="chart-container">
            <canvas id="main-chart"></canvas>
        </div>
        
        <div class="stats-footer">
            <div class="stats-grid" id="stats-grid"></div>
            
            <div class="legend">
                <div class="legend-title">Question Types</div>
                <div class="legend-grid" id="legend-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const questionTypes = [
            'analytical-multistep-reasoning',
            'procedural-how-to',
            'design-methodological',
            'evaluative-normative',
            'interpretive-contextual',
            'computational-numerical',
            'closed-factual',
            'conceptual-definition'
        ];
        
        const typeColors = {
            'analytical-multistep-reasoning': '#e74c3c',
            'procedural-how-to': '#3498db',
            'design-methodological': '#2ecc71',
            'evaluative-normative': '#f39c12',
            'interpretive-contextual': '#9b59b6',
            'computational-numerical': '#1abc9c',
            'closed-factual': '#e67e22',
            'conceptual-definition': '#34495e'
        };

        function calculateStats(values) {
            const n = values.length;
            if (n === 0) return { mean: 0, stdDev: 0, min: 0, max: 0, n: 0 };
            
            const sum = values.reduce((a, b) => a + b, 0);
            const mean = sum / n;
            
            const variance = values.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / n;
            const stdDev = Math.sqrt(variance);
            const min = Math.min(...values);
            const max = Math.max(...values);
            
            return { mean, stdDev, min, max, n };
        }

        function analyzeQuestionType(questions, answers) {
            const questionKeys = Object.keys(questions).sort((a, b) => {
                return parseInt(a.substring(1)) - parseInt(b.substring(1));
            });
            
            const answerKeys = Object.keys(answers).sort((a, b) => {
                return parseInt(a.substring(1)) - parseInt(b.substring(1));
            });

            const ratios = [];
            const questionValues = Object.values(questions);
            const answerValues = Object.values(answers);

            for (let i = 0; i < questionKeys.length; i++) {
                const ratio = answers[answerKeys[i]] / questions[questionKeys[i]];
                ratios.push(ratio);
            }

            return {
                avgRatio: ratios.reduce((a, b) => a + b, 0) / ratios.length,
                ratioStats: calculateStats(ratios),
                avgQuestionSSI: questionValues.reduce((a, b) => a + b, 0) / questionValues.length,
                avgAnswerSSI: answerValues.reduce((a, b) => a + b, 0) / answerValues.length
            };
        }

        function drawChart(results) {
            const canvas = document.getElementById('main-chart');
            const ctx = canvas.getContext('2d');
            
            // Set canvas size to match display size
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            const width = rect.width;
            const height = rect.height;
            
            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Margins
            const margin = { top: 20, right: 60, bottom: 140, left: 90 };
            const plotWidth = width - margin.left - margin.right;
            const plotHeight = height - margin.top - margin.bottom;
            
            // Prepare and sort data
            const entries = Object.entries(results)
                .map(([type, data]) => ({
                    type,
                    ratio: data.avgRatio,
                    color: typeColors[type]
                }))
                .sort((a, b) => b.ratio - a.ratio);
            
            const maxRatio = Math.max(...entries.map(e => e.ratio));
            const yMax = maxRatio * 1.15;
            
            // Bar dimensions
            const barWidth = (plotWidth / entries.length) * 0.75;
            const barSpacing = plotWidth / entries.length;
            
            // Draw background grid
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 1;
            const numGridLines = 10;
            for (let i = 0; i <= numGridLines; i++) {
                const y = margin.top + (plotHeight / numGridLines) * i;
                ctx.beginPath();
                ctx.moveTo(margin.left, y);
                ctx.lineTo(width - margin.right, y);
                ctx.stroke();
            }
            
            // Draw axes
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(margin.left, margin.top);
            ctx.lineTo(margin.left, height - margin.bottom);
            ctx.lineTo(width - margin.right, height - margin.bottom);
            ctx.stroke();
            
            // Y-axis labels
            ctx.fillStyle = '#333';
            ctx.font = '600 13px "IBM Plex Sans"';
            ctx.textAlign = 'right';
            for (let i = 0; i <= numGridLines; i++) {
                const value = yMax - (yMax * (i / numGridLines));
                const y = margin.top + (plotHeight / numGridLines) * i;
                ctx.fillText(value.toFixed(3), margin.left - 15, y + 5);
            }
            
            // Y-axis label
            ctx.save();
            ctx.translate(25, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.font = '700 15px "IBM Plex Sans"';
            ctx.fillStyle = '#000';
            ctx.textAlign = 'center';
            ctx.fillText('SSI RATIO (ANSWER / QUESTION)', 0, 0);
            ctx.restore();
            
            // Draw bars
            entries.forEach((entry, i) => {
                const x = margin.left + (i * barSpacing) + (barSpacing - barWidth) / 2;
                const barHeight = (entry.ratio / yMax) * plotHeight;
                const y = height - margin.bottom - barHeight;
                
                // Draw bar shadow
                ctx.fillStyle = 'rgba(0,0,0,0.08)';
                ctx.fillRect(x + 3, y + 3, barWidth, barHeight);
                
                // Draw bar
                ctx.fillStyle = entry.color;
                ctx.fillRect(x, y, barWidth, barHeight);
                
                // Draw bar border
                ctx.strokeStyle = entry.color;
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, barWidth, barHeight);
                
                // Draw value on top
                ctx.fillStyle = '#000';
                ctx.font = '700 14px "IBM Plex Mono"';
                ctx.textAlign = 'center';
                ctx.fillText(entry.ratio.toFixed(4), x + barWidth / 2, y - 12);
                
                // Draw x-axis labels (rotated)
                ctx.save();
                ctx.translate(x + barWidth / 2, height - margin.bottom + 20);
                ctx.rotate(-Math.PI / 3.5);
                ctx.fillStyle = entry.color;
                ctx.font = '600 13px "IBM Plex Sans"';
                ctx.textAlign = 'right';
                ctx.fillText(entry.type, 0, 0);
                ctx.restore();
            });
            
            // Draw average line
            const avgRatio = entries.reduce((sum, e) => sum + e.ratio, 0) / entries.length;
            const avgY = height - margin.bottom - (avgRatio / yMax) * plotHeight;
            
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 5]);
            ctx.beginPath();
            ctx.moveTo(margin.left, avgY);
            ctx.lineTo(width - margin.right, avgY);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Draw average label
            ctx.fillStyle = '#e74c3c';
            ctx.font = '700 14px "IBM Plex Sans"';
            ctx.textAlign = 'left';
            ctx.fillText(`MEAN: ${avgRatio.toFixed(4)}`, width - margin.right + 10, avgY + 5);
            
            return { avgRatio, entries };
        }

        async function fetchAllData() {
            const baseUrl = '../RESEARCH-DATA/investigation 1/question-types';
            const results = {};
            
            for (const qt of questionTypes) {
                try {
                    const questionsRes = await fetch(`${baseUrl}/${qt}/ssi_of_questions`);
                    const questionsData = await questionsRes.json();
                    
                    const answersRes = await fetch(`${baseUrl}/${qt}/ssi_of_answers`);
                    const answersData = await answersRes.json();
                    
                    results[qt] = analyzeQuestionType(questionsData, answersData);
                } catch (err) {
                    console.error(`Error fetching ${qt}:`, err);
                }
            }
            
            return results;
        }

        async function init() {
            const results = await fetchAllData();
            const { avgRatio, entries } = drawChart(results);
            
            // Populate stats
            const statsGrid = document.getElementById('stats-grid');
            const highest = entries[0];
            const lowest = entries[entries.length - 1];
            const range = highest.ratio - lowest.ratio;
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="label">Overall Mean</div>
                    <div class="value">${avgRatio.toFixed(4)}</div>
                    <div class="subvalue">Average Ratio</div>
                </div>
                <div class="stat-card" style="border-left-color: ${highest.color};">
                    <div class="label">Highest</div>
                    <div class="value">${highest.ratio.toFixed(4)}</div>
                    <div class="subvalue">${highest.type}</div>
                </div>
                <div class="stat-card" style="border-left-color: ${lowest.color};">
                    <div class="label">Lowest</div>
                    <div class="value">${lowest.ratio.toFixed(4)}</div>
                    <div class="subvalue">${lowest.type}</div>
                </div>
                <div class="stat-card">
                    <div class="label">Range</div>
                    <div class="value">${range.toFixed(4)}</div>
                    <div class="subvalue">Difference</div>
                </div>
            `;
            
            // Populate legend
            const legendGrid = document.getElementById('legend-grid');
            legendGrid.innerHTML = questionTypes.map(type => `
                <div class="legend-item">
                    <div class="legend-color" style="background-color: ${typeColors[type]};"></div>
                    <span>${type}</span>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
